name: quote_line_item
label: Quote Line Item
description: 
fields:
  date:
    label: Date
    help: Product date, effective date, or other date related to the product.
    description: 
  description:
    label: Line Item Description
    help: 
    description: 
  discount:
    label: Discount
    help: The discount you apply to the line item. You can enter numbers with or without a percentage symbol, using up to two decimal places.
    description: 
  has_schedule:
    label: Schedule
    help: Whether the line item is using a schedule in the opportunity. Default schedules are not transferred from the opportunity when an opportunity product is copied to a quote.
    description: 
  line_number:
    label: Line Item Number
    help: 
    description: 
  list_price:
    label: List Price
    help: 
    description: 
  product_id:
    label: Product
    help: The name of the line item product listed in the price book.
    description: 
  quantity:
    label: Quantity
    help: The number of sets of the line item product included in the quote. The value must be greater than or equal to 1. If the quote is synced with an opportunity, this field is updated from the quote line item to the opportunity product.
    description: 
  quote_id:
    label: Quote Name
    help: 
    description: 
  subtotal:
    label: Subtotal
    help: Sale price multiplied by quantity for the line item.
    description: 
  total_price:
    label: Total Price
    help: Sale price multiplied by quantity for the line item, minus the discount.
    description: 
  unit_price:
    label: Sale Price
    help: >-
      The price of the product you wish to use. Initially, the sale price of an opportunity or quote product is the list price of that product from the price book, but you can change it here. If the quote is synced with an opportunity, this field is updated from the quote line item to the opportunity product.
    description: 
