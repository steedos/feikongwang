  hierarchy_amount_all_opportunities:
    label: Amount of Opportunities in Hierarchy
    help: >-
      Calculated field for the total value of all opportunities (including won opportunities) associated with the campaign hierarchy. (Read-only) All campaigns in the hierarchy must use the same currency. For organizations using multiple currencies, opportunity values should be converted to the campaign currency. If your currency does not match the campaign currency, the amount will be converted to your currency and displayed in parentheses.
    description: 
  hierarchy_number_of_opportunities:
    label: Number of Opportunities in Hierarchy
    help: Calculated field for the total number of opportunities associated with the campaign hierarchy. (Read-only)
    description: 
  hierarchy_number_sent:
    label: Number Sent in Hierarchy
    help: Calculated field for the total number of individuals targeted in the campaign hierarchy, such as the total number of emails sent. (Read-only)
    description: 
  inhierarchy_amount_won_opportunities:
    label: Amount of Won Opportunities in Hierarchy
    help: >-
      Calculated field for the value of won opportunities associated with the campaign hierarchy. (Read-only) All campaigns in the hierarchy must use the same currency. For organizations using multiple currencies, opportunity values should be converted to the campaign currency. If your currency does not match the campaign currency, the amount will be converted to your currency and displayed in parentheses.
    description: 
