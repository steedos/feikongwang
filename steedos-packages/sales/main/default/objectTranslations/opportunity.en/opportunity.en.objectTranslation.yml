name: opportunity
label: Opportunity
description: 
fields:
  account:
    label: Customer
    help: The customer associated with the opportunity. You can enter the customer name or use the lookup icon to select a customer. If the changed customer has a partner, all partners will be removed from the "Partners" related list.
    description: 
  amount:
    label: Amount
    help: >-
      The estimated total sale amount. If multiple currencies are enabled, the amount is displayed in your personal currency by default. Change the opportunity currency option list to track the amount in another currency. For opportunities with products, the amount is the sum of the related products. You cannot directly edit the amount unless the opportunity has no products. To change the amount for an opportunity with products, edit the selling price or quantity of the related products. If you change the price book for the opportunity, all products are removed from the related list under the opportunity, but the value in this field remains unchanged.
    description: 
  budget_confirmed:
    label: Budget Confirmed
    help: 
    description: 
  campaign_id:
    label: Primary Campaign Source
    help: >-
      The name of the campaign responsible for generating the opportunity. For opportunities created during lead conversions, this field automatically populates with the campaign name from the lead. If a lead has multiple related campaigns, the most recently updated member status campaign is inserted into the opportunity. For opportunities influenced by multiple campaigns, click Edit next to the primary campaign in the Campaign Influence related list on the opportunity detail page and select the Primary Campaign Source checkbox. The campaign is displayed in the Primary Campaign Source field on the opportunity.
    description: 
  description:
    label: Description
    help: 
    description: 
  discovery_completed:
    label: Discovery Completed
    help: 
    description: 
  due_date:
    label: Close Date
    help: >-
      The date you plan to close the opportunity. You can enter a date or select one from the calendar that appears when you hover in the field. Opportunities with close dates within a specific time period are included in forecasting for that period, unless you've allocated it to the "Omit" category, or forecast by scheduled or product date. When you set the stage of an open opportunity to "Closed/Won," the close date is set to the current date in Coordinated Universal Time (UTC) if the initial date was in the future. At certain times of the day, UTC might differ from your time zone by a day. If the closed date is the past close date of the opportunity, it cannot be changed.
    description: 
  expected_revenue:
    label: Expected Revenue
    help: Revenue calculated based on the amount and opportunity probability.
    description: 
  forecast_category:
    label: Forecast Category
    help: The forecast category name displayed in reports, opportunity details and edit pages, opportunity searches, and opportunity list views. The opportunity's category is linked to its stage.
    options:
      - label: Omit
        value: Omit
      - label: Sales Funnel
        value: Sales_Funnel
      - label: Maximum Amount
        value: Maximum_Amount
      - label: Submit
        value: Submit
      - label: Close
        value: Close
    description: 
  iq_score:
    label: Opportunity Score
    help: 
    description: 
  lead_source:
    label: Lead Source
    help: 
    options:
      - label: Advertisement
        value: Advertisement
      - label: Customer Event
        value: Customer_Event
      - label: Employee Referral
        value: Employee_Referral
      - label: Baidu Search
        value: Baidu_AdWords
      - label: Other
        value: Other
      - label: Partner
        value: Partner
      - label: Purchased List
        value: Purchased_List
      - label: Trade Show
        value: Trade_Show
      - label: Webinar
        value: Webinar
      - label: Website
        value: Website
    description: 
  loss_reason:
    label: Loss Reason
    help: 
    options:
      - label: Lost to Competitor
        value: Lost_to_Competitor
      - label: No Budget
        value: No_Budget_Lost_Funding
      - label: No Response
        value: No_Decision_Non-Responsive
      - label: Price Issue
        value: Price
      - label: Other
        value: Other
    description: 
  name:
    label: Opportunity Name
    help: 
    description: 
  next_step:
    label: Next Step
    help: Describes the tasks for the next step after closing the opportunity.
    description: 
  opportunity_currency:
    label: Opportunity Currency
    help: >-
      The default currency for all currency amount fields in the opportunity. Amounts are displayed in the opportunity currency and converted to the user's personal currency. Available only if multiple currencies are enabled. For opportunities with products, the currency is linked to the related price book's currency. You cannot directly edit this field unless you first remove the products.
    description: 
  owner:
    label: Our Account Manager
    help: 
    description: 
  partner_account:
    label: Partner Account
    help: Indicates that the opportunity belongs to a partner (read-only).
    description: 
  private:
    label: Private
    help: The opportunity is private. Only the record owner, users above that role in the hierarchy, and administrators can view, edit, or report on private records.
    description: 
  probability:
    label: Opportunity Probability (%)
    help: >-
      The probability of closing the opportunity, expressed as a percentage. Probability values are always updated by changes in stage value, even if the probability field is marked as read-only in your page layout. Users with edit permissions for this field can override the value.
    options:
      - label: 10%
        value: 10%
      - label: 35%
        value: 35%
      - label: 75%
        value: 75%
      - label: 90%
        value: 90%
      - label: 100%
        value: 100%
      - label: 0%
        value: 0%
    description: 
  rating:
    label: Rating
    help: 
    options:
      - label: Very Important
        value: Hot
      - label: Important
        value: Warm
      - label: Normal
        value: Cold
    description: 
  roi_analysis_completed:
    label: ROI Analysis Completed
    help: 
    description: 
  stage:
    label: Opportunity Stage
    help: >-
      Administrators associate values in this option list with "Forecast Category" values that determine how the opportunity contributes to your forecast. If the original date is in the future, when you set the stage of an open opportunity to "Closed/Won," the close date is set to the current date in Coordinated Universal Time (UTC). At certain times of the day, UTC might differ from your time zone by a day. If the closed date is the past close date of the opportunity, it cannot be changed.
    options:
      - label: Initial Communication
        value: Qualification
      - label: Project Tracking
        value: Needs_Analysis
      - label: Proposal
        value: Proposal
      - label: Negotiation
        value: Negotiation
      - label: Closed Won
        value: Closed_Won
      - label: Closed Lost
        value: Closed_Lost
    description: 
  synced_quoted:
    label: Synced Quote
    help: Quote synced to the opportunity. Only one quote can be synced to the opportunity.
    description: 
  total_opportunity_quantity:
    label: Quantity
    help: For opportunities with products, the total of all quantity field values for all products in the "Products" related list. For opportunities without products, it is a generic field.
    description: 
  type:
    label: Opportunity Type
    help: The type of opportunity, such as "Existing Business" or "New Business."
    options:
      - label: Existing Business
        value: Existing_Business
      - label: New Business
        value: New_Business
    description: 
