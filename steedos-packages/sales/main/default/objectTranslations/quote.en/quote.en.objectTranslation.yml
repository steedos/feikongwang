fields:
  account_id:
    label: Customer
    help: The name of the customer linked to the opportunity of the quote.
    description: 
  billing_address:
    label: Billing Address
    help: 
    description: 
  billing_name:
    label: Billing Name
    help: 
    description: 
  contact_id:
    label: Contact Name
    help: The name of the contact associated with the quote.
    description: 
  description:
    label: Description
    help: 
    description: 
  discount:
    label: Discount
    help: The weighted average of all line item discounts on the quote. You can use up to two decimal places.
    description: 
  email:
    label: Email
    help: The email address of the contact associated with the quote. Automatically filled when you add a contact, if available.
    description: 
  expiration_date:
    label: Expiration Date
    help: The date the quote becomes invalid.
    description: 
  fax:
    label: Fax
    help: The fax number of the contact associated with the quote. Automatically filled when you add a contact, if available.
    description: 
  grand_total:
    label: Grand Total
    help: The total price of the quote plus shipping and tax.
    description: 
  is_syncing:
    label: Syncing
    help: Indicates whether the quote is synced with the associated opportunity. (Read-only)
    description: 
  line_items:
    label: Line Items
    help: The number of line items on the quote.
    description: 
  name:
    label: Quote Name
    help: 
    description: 
  opportunity_id:
    label: Opportunity Name
    help: The name of the opportunity associated with the quote.
    description: 
  owner:
    label: Owner Name
    help: 
    description: 
  phone:
    label: Phone
    help: The phone number of the contact associated with the quote. Automatically filled when you add a contact, if available.
    description: 
  quote_currency:
    label: Quote Currency
    help: 
    description: 
  quote_number:
    label: Quote Number
    help: 
    description: 
  quote_to_address:
    label: Quote To Address
    help: 
    description: 
  quote_to_name:
    label: Quote To Name
    help: 
    description: 
  shipping_address:
    label: Shipping Address
    help: The shipping address of the customer associated with the quote.
    description: 
  shipping_handling:
    label: Shipping and Handling
    help: The total freight and handling charges for the quote.
    description: 
  shipping_name:
    label: Shipping Name
    help: The name of the entity (individual or company) receiving the shipping for the quote line item.
    description: 
  status:
    label: Status
    help: The status of the quote.
    options:
      - label: Draft
        value: Draft
      - label: Needs Review
        value: Needs_Review
      - label: In Review
        value: In_Review
      - label: Approved
        value: Approved
      - label: Rejected
        value: Rejected
      - label: Presented
        value: Presented
      - label: Accepted
        value: Accepted
      - label: Denied
        value: Denied
    description: 
  subtotal:
    label: Subtotal
    help: The sum of the quote line items before applying discounts, taxes, and shipping charges. (Read-only)
    description: 
  tax:
    label: Tax
    help: The total tax amount for the quote.
    description: 
  total_price:
    label: Total Price
    help: The sum of the quote line items after discounts, excluding taxes and shipping charges. (Read-only)
    description: 
