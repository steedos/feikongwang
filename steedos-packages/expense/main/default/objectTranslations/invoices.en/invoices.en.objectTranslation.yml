        value: '1008'
        description: Invoice request parameters cannot be empty.
      - label: Incorrect Parameter Length
        value: '1009'
        description: Parameter length is incorrect. Please verify and retry.
      - label: Cannot Verify Today's Date
        value: '1014'
        description: Cannot verify the invoice with today's date. Please try the next day.
      - label: Cannot Verify Over 5 Years
        value: '1015'
        description: Cannot verify invoices older than 5 years.
      - label: No Verification Permission
        value: '1020'
        description: No verification permission. Please submit a ticket for support.
      - label: Network Timeout
        value: '1021'
        description: Tax bureau is under maintenance. Verification is temporarily unavailable. Please submit a ticket for support.
